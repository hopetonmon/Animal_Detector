<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Animal Detector</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px;
      background: #f5f5f5;
    }
    h1 {
      color: #333;
    }
    #upload-box {
      margin: 20px auto;
      padding: 20px;
      border: 2px dashed #aaa;
      width: 300px;
      background: white;
    }
    #image-preview {
      max-width: 300px;
      margin-top: 20px;
      border: 1px solid #ddd;
      display: none;
    }
    #results {
      margin-top: 20px;
      font-size: 1.1em;
      color: #222;
    }
    .prediction {
      margin-top: 5px;
    }
  </style>
</head>
<body>

  <h1>Animal Detector</h1>
  <p>Upload an image to see the predicted animal class.</p>

  <div id="upload-box">
    <input type="file" id="file-input" accept="image/*"/>
    <img id="image-preview" />
  </div>

  <div id="results"></div>

  <!-- TensorFlow.js and Teachable Machine Image Library -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

  <script>
    const modelURL = "./model.json";
    const metadataURL = "./metadata.json";

    let model;

    async function init() {
      model = await tmImage.load(modelURL, metadataURL);
      console.log("Model loaded.");
    }

    const fileInput = document.getElementById("file-input");
    const preview = document.getElementById("image-preview");
    const results = document.getElementById("results");

    fileInput.addEventListener("change", async (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (e) => {
        preview.src = e.target.result;
        preview.style.display = "block";

        const prediction = await model.predict(preview);
        displayResults(prediction);
      };
      reader.readAsDataURL(file);
    });

    function displayResults(prediction) {
      results.innerHTML = "<h3>Predictions:</h3>";
      prediction.sort((a,b) => b.probability - a.probability);
      prediction.forEach(p => {
        const percent = (p.probability * 100).toFixed(2);
        results.innerHTML += `<div class="prediction">${p.className}: ${percent}%</div>`;
      });
    }

    init();
  </script>
</body>
</html>
