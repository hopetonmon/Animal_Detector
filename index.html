<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animal Detector</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 2rem;
      background-color: #f4f4f4;
    }
    #uploaded-image {
      max-width: 300px;
      margin-top: 1rem;
    }
    #prediction {
      margin-top: 1rem;
      font-size: 1.2rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Animal Detector</h1>
  <p>Upload an animal photo to see the prediction:</p>
  <input type="file" id="imageUpload" accept="image/*">
  <br>
  <img id="uploaded-image" src="" alt="">
  <div id="prediction"></div>

  <!-- Teachable Machine Library -->
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>

  <script>
    const URL = './Animal_Detector/'; // folder where model.json is
    let model, maxPredictions;

    // Load the model
    async function init() {
      const modelURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";

      model = await tmImage.load(modelURL, metadataURL);
      maxPredictions = model.getTotalClasses();
    }

    // Run prediction on uploaded image
    async function predictImage(file) {
      const img = document.getElementById('uploaded-image');
      img.src = URL.createObjectURL(file);
      img.onload = async () => {
        const prediction = await model.predict(img);
        let resultText = '';
        prediction.forEach(pred => {
          resultText += `${pred.className}: ${(pred.probability * 100).toFixed(2)}%<br>`;
        });
        document.getElementById('prediction').innerHTML = resultText;
      };
    }

    // Event listener for file upload
    document.getElementById('imageUpload').addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        predictImage(e.target.files[0]);
      }
    });

    init();
  </script>
</body>
</html>
